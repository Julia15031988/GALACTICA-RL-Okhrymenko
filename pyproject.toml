[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galactica-rl"
version = "0.1.0"
description = "Autonomous Space Navigation Through Deep Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26,<3",
    "gymnasium>=1.0,<2",
    "torch>=2.3,<3",
    "stable-baselines3>=2.4,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
